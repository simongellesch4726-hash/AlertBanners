name: unzip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract archive
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n1)
          [ -f "$ZIP" ] || { echo "No ZIP found"; exit 1; }

          mkdir _tmp
          unzip -q "$ZIP" -d _tmp

          ROOTDIR=$(find _tmp -mindepth 1 -maxdepth 1 -type d | head -n1)

          if [ -z "$ROOTDIR" ]; then
            echo "No extracted folder found."
            exit 1
          fi

          # Move EVERYTHING (including hidden files) into repo root
          find "$ROOTDIR" -mindepth 1 -maxdepth 1 -exec mv -t . {} +

          rm -rf _tmp
          rm -f "$ZIP"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Extract ZIP"
          git push
